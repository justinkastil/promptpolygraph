name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (core + service + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,service]"

      - name: Run tests
        run: pytest -q

      - name: Reference integrity (OWASP/ATLAS mapping pinned)
        run: polygraph references --check

      - name: Validation package (IQ/OQ/PQ)
        run: polygraph validate --out /tmp/evidence

      - name: Offline smoke (default example, no API key)
        run: |
          polygraph all --config examples/everyday_assistant/config.yaml \
            --out-dir /tmp/ci_out --mock --format md,html || true
          test -f /tmp/ci_out/*/report.md

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Resolve the full install set so the audit sees every shipped extra,
      # not just core. Failing here blocks the merge on a high/critical CVE.
      - name: Install (all extras for full dependency coverage)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,service,llm,pdf,crypto,oidc]"
          pip install pip-audit
      # --vulnerability-service osv uses the OSV database (no auth required).
      # Findings the team has triaged go in .pip-audit-ignore (one VULN-ID per
      # line, # comments allowed); the file is empty by default.
      - name: CVE scan (fail on high/critical)
        run: |
          ignores=""
          if [ -f .pip-audit-ignore ]; then
            while IFS= read -r line; do
              case "$line" in ''|\#*) continue ;; esac
              ignores="$ignores --ignore-vuln $line"
            done < .pip-audit-ignore
          fi
          pip-audit --vulnerability-service osv $ignores

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (core + types)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[types]"
      - name: mypy (public modules per [tool.mypy] config)
        run: mypy

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel + sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Verify persona data is packaged
        run: |
          python - <<'PY'
          import glob, zipfile, sys
          whl = sorted(glob.glob("dist/*.whl"))[-1]
          names = zipfile.ZipFile(whl).namelist()
          personas = [n for n in names if n.startswith("promptpolygraph/data/personas/") and n.endswith(".yaml")]
          assert len(personas) >= 12, f"persona data missing from wheel: {personas}"
          assert "promptpolygraph/data/references.lock.json" in names, "reference lock missing from wheel"
          print(f"ok: {len(personas)} persona files + reference lock packaged in {whl}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
      # CycloneDX SBOM over the installed environment (resolved transitive
      # deps), emitted as JSON for downstream attestation/release attachment.
      - name: Generate CycloneDX SBOM
        run: |
          pip install -e . cyclonedx-bom
          cyclonedx-py environment --output-format JSON --outfile sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
