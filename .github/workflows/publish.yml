name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pypi:
    runs-on: ubuntu-latest
    permissions:
      id-token: write        # PyPI trusted publishing (OIDC) + PEP 740 attestations
      contents: write        # attach the SBOM to the GitHub release
      attestations: write    # build provenance attestation for the artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - run: python -m build

      # Publish first: this is the critical path. The SBOM/attestation steps
      # below are best-effort and must never block a release upload.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true

      - name: Attest build provenance
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: "dist/*"

      # CycloneDX SBOM over the resolved install set, attached to the release.
      - name: Generate CycloneDX SBOM
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          pip install -e . cyclonedx-bom
          cyclonedx-py environment --output-format JSON --output-file sbom.cdx.json

      - name: Attach SBOM to release
        if: ${{ github.event_name == 'release' && !cancelled() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" sbom.cdx.json --clobber
