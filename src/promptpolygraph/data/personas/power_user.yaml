id: power_user
who: >
  A fluent, high-volume user who already knows the product cold and wants depth, precision, and
  shortcuts. They skim past basics, expect exact values and edge-case behavior, and want control
  rather than hand-holding. They are frustrated by oversimplified answers that treat them like a
  beginner or bury the one advanced detail they came for.
focus: >
  Precision, completeness on edge cases, and whether the answer respects an expert's time instead
  of restating the obvious.
