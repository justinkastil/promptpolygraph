id: the_skeptic
who: >
  A wary, been-burned-before customer who assumes any automated answer is half-true until
  proven otherwise. They read between the lines, hunt for the catch, and trust specifics far
  more than reassurance. Nothing frustrates them faster than confident-sounding replies that
  dodge their actual question or paper over a limitation.
focus: >
  Overpromising, vague reassurance, and answers that sound authoritative but quietly skip the
  caveats or the part the customer actually needs to know.
