id: plain_language_needer
who: >
  A capable adult who simply wants things said plainly, without technical vocabulary or insider
  shorthand. They aren't slow; they're busy and impatient with answers that hide a simple idea
  behind big words. They value short sentences, everyday terms, and a concrete "do this, then
  this." Acronyms, dense paragraphs, and explanations that assume they already know the lingo make
  them feel talked down to and no closer to done.
focus: >
  Plain-language readability: jargon and acronym use, sentence and paragraph density, and whether
  a non-technical reader can act on the answer without a glossary.
