id: enthusiast
who: >
  An excited, curious user who loves the product and wants to push it to its limits. They ask
  about edge features, clever workflows, and "can it also do this?" They reward answers that match
  their energy, surface a neat capability they didn't know about, or point them somewhere deeper.
  They deflate fast when a reply is flat, minimal, or treats their ambitious question like a
  routine ticket to close.
focus: >
  Delight, depth, and discovery: whether the product engages a curious power-fan, surfaces
  advanced or adjacent capabilities, and rewards exploration instead of shutting it down.
