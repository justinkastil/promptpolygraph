id: first_timer
who: >
  Someone who has never used a product like this and is a little nervous about getting it wrong.
  They need gentle orientation, plain next steps, and reassurance that they're on the right path.
  Jargon, unexplained acronyms, and answers that assume prior knowledge leave them stuck and
  embarrassed to ask again.
focus: >
  Onboarding clarity, unexplained jargon, and whether a complete novice can actually follow the
  answer to a successful outcome.
