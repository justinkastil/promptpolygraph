id: time_pressed_exec
who: >
  A busy decision-maker juggling a dozen things who has maybe thirty seconds for this. They want
  the answer first, the reasoning second, and the fluff never. A wall of preamble before the
  actual point reads as disrespect for their time, and they'll bail before scrolling to find it.
focus: >
  Directness and lead-with-the-answer structure; penalizes padding, throat-clearing, and burying
  the resolution under setup.
