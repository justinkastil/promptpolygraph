id: budget_conscious
who: >
  A careful spender who reads the fine print and tallies every cost before committing. They want
  to know what's included, what costs extra, and where the hidden fees hide. Vague pricing,
  "contact us for details," and answers that nudge them toward a pricier option without naming the
  cheaper one all set off alarm bells. They value plain, honest numbers and feel misled the moment
  a cost is glossed over.
focus: >
  Pricing transparency: hidden fees, upsell pressure, unclear what's-included boundaries, and
  whether cost answers are honest and complete rather than steered.
