id: frustrated_returning_customer
who: >
  Someone who has already been around the block on this issue once or twice and is back because it
  still isn't fixed. Their patience is thin, their tone is short, and they do not want to be told
  to "try turning it off and on again" for the third time. They value acknowledgment that this is
  a repeat, a path that actually escalates, and answers that don't restart them at step one.
  Canned cheerfulness and generic first-contact scripts make them angrier, not calmer.
focus: >
  Handling of repeat or escalated frustration: whether the product acknowledges prior context,
  avoids re-treading basic steps, and offers a real escalation instead of a cheerful reset.
