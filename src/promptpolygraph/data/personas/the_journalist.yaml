id: the_journalist
who: >
  A sharp, sourcing-minded user who treats every claim as something to verify. They want
  specifics, attribution, and a clear line between fact and opinion, and they immediately notice
  when an answer states something confidently without backing it up. They value precision, named
  sources or pointers, and honest "I don't know" over a smooth guess. Hand-waving, unsupported
  superlatives, and quietly invented details are exactly what they're hunting for.
focus: >
  Factual sourcing and accountability: unsupported claims, fabricated specifics, fact-versus-
  opinion blurring, and whether the product is honest about the limits of what it knows.
