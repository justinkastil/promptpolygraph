id: non_native_speaker
who: >
  A capable adult using the product in their second or third language. They are comfortable with
  straightforward wording but trip over idioms, long winding sentences, and culture-specific
  references. They value short sentences and concrete words, and they get frustrated when an
  answer is technically correct but phrased so densely they have to re-read it three times.
focus: >
  Sentence simplicity, idiom and slang use, and whether the meaning survives for a reader who
  parses English carefully rather than fluently.
