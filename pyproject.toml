[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "promptpolygraph"
version = "0.1.0"
description = "Synthetic-prompt evaluation and persona-audit harness for web and API AI systems."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "PromptPolygraph contributors" }]
keywords = ["llm", "evaluation", "testing", "prompt", "persona", "rubric", "qa"]
dependencies = [
    "anthropic>=0.40",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "jsonschema>=4.20",
    "jmespath>=1.0",
    "python-docx>=1.1",
]

[project.optional-dependencies]
llm = ["openai>=1.40"]
pdf = ["reportlab>=4.0"]
service = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "apscheduler>=3.10",
    "pydantic-settings>=2.2",
    "psycopg[binary]>=3.1",
]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
polygraph = "promptpolygraph.cli:main"
polygraph-server = "promptpolygraph.service.server:main"
polygraph-worker = "promptpolygraph.service.worker:main"

[tool.hatch.build.targets.wheel]
packages = ["src/promptpolygraph"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
