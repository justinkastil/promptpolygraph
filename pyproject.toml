[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "promptpolygraph"
version = "1.0.0"
description = "Synthetic-prompt evaluation and persona-audit harness for web and API AI systems."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "PromptPolygraph contributors" }]
keywords = ["llm", "evaluation", "testing", "prompt", "persona", "rubric", "qa"]
dependencies = [
    "anthropic>=0.40",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "jsonschema>=4.20",
    "jmespath>=1.0",
    "python-docx>=1.1",
    "jinja2>=3.1",
]

[project.optional-dependencies]
llm = ["openai>=1.40"]
# Universal multi-provider routing (Bedrock, Vertex AI, Azure, Gemini, Cohere,
# and others) via the "litellm" provider. Optional: anthropic + the OpenAI-
# compatible/local paths work without it.
litellm = ["litellm>=1.40"]
pdf = ["reportlab>=4.0"]
# Ed25519 public-key signing of run bundles / report attestations. Optional:
# HMAC signing (stdlib) is the default; this adds verifiable public-key signing.
crypto = ["cryptography>=42.0"]
# OIDC/OAuth2 SSO for the service (Okta/Entra/Keycloak/Auth0). Optional: the
# API-key path works without it; this verifies IdP-issued bearer JWTs.
oidc = ["pyjwt[crypto]>=2.8"]
service = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "apscheduler>=3.10",
    "pydantic-settings>=2.2",
    "psycopg[binary]>=3.1",
]
# OSS-grounded attack sources. All optional: the built-in `catalog` source and
# the LLM attackers work with none of these installed; each source registers
# only when its dependency imports. Datasets are fetched on demand, not bundled.
redteam = [
    "garak>=0.9",            # NVIDIA garak probe suite (Apache-2.0)
    "pyrit>=0.5",            # Microsoft PyRIT — Crescendo/TAP multi-turn (MIT)
    "deepteam>=0.1",         # Confident AI DeepTeam — OWASP taxonomy (Apache-2.0)
    "datasets>=2.19",        # HuggingFace datasets loader for AdvBench/HarmBench/JBB
    "huggingface-hub>=0.23",
]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
types = ["mypy>=1.10"]

[project.scripts]
polygraph = "promptpolygraph.cli:main"
polygraph-server = "promptpolygraph.service.server:main"
polygraph-worker = "promptpolygraph.service.worker:main"

# Built-in extensions are declared as entry points so the plugin-discovery path
# is exercised by the package itself, not only by third parties. The built-in
# adapter types are resolved directly in build_adapter and take precedence; the
# entries below make them visible to `polygraph plugins list` and serve as the
# reference contract for third-party packages.
[project.entry-points."promptpolygraph.adapters"]
http = "promptpolygraph.adapters.http:HTTPAdapter"
llm = "promptpolygraph.adapters.llm:LLMAdapter"
demo = "promptpolygraph.adapters.demo:DemoAdapter"
callable = "promptpolygraph.adapters.callable:CallableAdapter"

[project.entry-points."promptpolygraph.sources"]
catalog = "promptpolygraph.redteam.sources.catalog_source:CatalogSource"

[tool.hatch.build.targets.wheel]
packages = ["src/promptpolygraph"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# Pragmatic config: surface real type errors on the public-facing modules
# without demanding full strictness across the tree. Third-party stubs are
# frequently absent for optional deps (garak/pyrit/datasets/reportlab/...), so
# missing imports are ignored rather than blocking the run. The package ships a
# py.typed marker so downstream consumers can opt into these checks.
[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_configs = true
# Default check target. Scoped to public modules that pass cleanly today; the
# broader tree (cli, service, redteam, report, ...) is not yet annotated and
# would only add noise. A bare `mypy` invocation checks exactly these.
files = [
    "src/promptpolygraph/__init__.py",
    "src/promptpolygraph/models.py",
    "src/promptpolygraph/config.py",
    "src/promptpolygraph/llm.py",
    "src/promptpolygraph/audit_log.py",
    "src/promptpolygraph/migrations.py",
    "src/promptpolygraph/discovery.py",
    "src/promptpolygraph/schema_gen.py",
    "src/promptpolygraph/scaffold.py",
    "src/promptpolygraph/configdesign.py",
]
